version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dislubinca_postgres
    restart: always
    environment:
      POSTGRES_USER: dislubinca_user
      POSTGRES_PASSWORD: dislubinca2312
      POSTGRES_DB: dislubinca_loyalty_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dislubinca_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dislubinca.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: